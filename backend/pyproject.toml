[project]
name = "careeros-backend"
version = "0.1.0"
description = "CareerOS Backend - Production-Grade AI Career Copilot Service"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.2.0",
]
authors = [
    { name = "CareerOS Contributors" }
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pre-commit>=3.6.0",
    "ruff>=0.3.0",
]

[tool.ruff]
# Target Python 3.12 features and constructs
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Enable standard and strict-enough quality assurance rule groups
# E/W: pycodestyle
# F: Pyflakes
# I: isort
# N: pep8-naming
# UP: pyupgrade
# B: flake8-bugbear
# C4: flake8-comprehensions
# ARG: flake8-unused-arguments
# PTH: flake8-use-pathlib
# RUF: Ruff-specific rules
select = [
    "E", "W",   # pycodestyle (style violations & spacing)
    "F",        # Pyflakes (errors, unused imports, undefined variables)
    "I",        # isort (import statements ordering)
    "N",        # pep8-naming (naming conventions)
    "UP",       # pyupgrade (upgrading syntax to modern Python)
    "B",        # flake8-bugbear (common bug patterns)
    "C4",       # flake8-comprehensions (comprehension check)
    "ARG",      # flake8-unused-arguments (checking unused variables)
    "PTH",      # flake8-use-pathlib (use modern pathlib over os.path)
    "RUF",      # Ruff-specific rules (additional code quality guards)
]
ignore = [
    "D",        # Defer pydocstyle to maintain development velocity in early sprints
    "ANN",      # Defer strict type annotation lint checks to avoid boilerplate (we use mypy instead)
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
